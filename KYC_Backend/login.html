<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — KYC System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue your verification</p>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" required>

      <button type="submit">Log in</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="footer-link">Don't have an account? <a href="register.html">Register</a></div>
  </div>

<script src="config.js"></script>
<script>
const form = document.getElementById('loginForm');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  msg.textContent = '';

  const payload = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
  };

  try {
    const res = await fetch(`${API_BASE}/login.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      credentials: 'include',
    });
    const data = await res.json();

    if (data.success) {
      msg.className = 'msg success';
      msg.textContent = 'Logged in! Redirecting...';
      const dest = data.user.role === 'admin' ? 'admin.html' : 'upload.html';
      setTimeout(() => window.location.href = dest, 800);
    } else {
      msg.className = 'msg error';
      msg.textContent = data.error || 'Login failed';
    }
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = 'Could not reach the server';
  }
});
</script>
</body>
</html>
